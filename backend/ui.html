<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>资源工具</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18221f;background:#f4f5f2}*{box-sizing:border-box}body{margin:0}header{max-width:1040px;margin:auto;padding:30px 32px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:17px;font-weight:650;letter-spacing:-.5px}.status{font-size:12px;color:#62736b;display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#88a995}main{max-width:580px;margin:44px auto 60px;padding:0 24px}.progress{display:flex;gap:6px;margin-bottom:38px}.progress i{height:3px;flex:1;border-radius:4px;background:#dfe5df}.progress .done{background:#2c6752}.eyebrow{font-size:12px;color:#7b8981;margin-bottom:13px}h1{font-size:34px;letter-spacing:-1.1px;font-weight:600;margin:0 0 14px;line-height:1.25}.intro{color:#718077;font-size:15px;line-height:1.7;margin:0 0 28px}.card{border:1px solid #e1e6df;border-radius:18px;background:#fff;padding:24px}.drop{display:block;position:relative;border:1px dashed #c5d2c9;border-radius:13px;padding:30px 16px;text-align:center;background:#fafcf9;cursor:pointer}.drop strong{font-size:16px;font-weight:550;display:block}.drop small{display:block;margin-top:8px;color:#8a968e;font-size:12px}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.row{padding:15px 0;border-bottom:1px solid #eef1ec;font-size:15px;line-height:1.65}.row:last-child{border-bottom:0}.path{font-size:18px;line-height:1.8;letter-spacing:-.3px}.note{font-size:13px;line-height:1.7;color:#7b8981;margin:18px 0 0}.actions{display:flex;gap:10px;align-items:center;margin-top:28px}button{font:inherit;font-size:14px;cursor:pointer;border:0;border-radius:10px;padding:14px 22px;background:#255943;color:white;font-weight:550}button:disabled{opacity:.4;cursor:wait}.back{background:none;color:#819087;padding-left:0;margin-right:auto}.secondary{background:#e8ede6;color:#44594b}.qr{width:190px;height:190px;display:block;margin:0 auto 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#f4f7f1;border-radius:10px;padding:16px;font-size:12px;color:#7b8981}.field strong{display:block;color:#213e2d;font-size:21px;font-weight:550;margin-top:6px;overflow-wrap:anywhere}.message{font-size:13px;line-height:1.6;color:#a34d2c;min-height:20px;margin-top:18px}.hidden{display:none}details{margin-top:24px;font-size:12px;color:#8a968e}summary{cursor:pointer;padding:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font-size:11px}.success{color:#2c6752;font-size:28px;margin-bottom:16px}footer{font-size:11px;color:#9aa49c;text-align:center;margin-top:40px}@media(max-width:600px){main{margin-top:22px}header{padding:24px}h1{font-size:29px}.fields{grid-template-columns:1fr}}
.taskChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card:has(.taskChoices){padding:0;border:0;background:transparent}.taskChoice{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 16px;border:1px solid #dce5dc;border-radius:16px;background:#fff;cursor:pointer;text-align:center}.taskChoice:has(input:checked){border-color:#255943;background:#edf4ee}.taskChoice input{position:absolute;left:16px;top:16px;accent-color:#255943}.taskChoice strong{font-size:18px;line-height:1.5;font-weight:600}.taskChoice span{font-size:12px;line-height:1.7;color:#718077}.connectionHelp{margin-top:22px;color:#718077;font-size:13px;line-height:1.8}.connectionHelp p{margin:6px 0}</style><header><div class="brand">资源工具 <span style="color:#9aa59d;font-weight:400">/ 本地助手</span></div><div style="display:flex;align-items:center;gap:20px"><button class="back" style="margin:0;padding:0" onclick="quitHelper()">退出助手</button><div class="status"><span class="dot"></span><span id="status">本机连接</span></div></div></header><main><div class="progress" id="progress"></div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="intro" id="intro"></p><div class="card" id="content"></div><div id="connectionHelp" class="connectionHelp hidden"><p>检查电脑与手机连接的 Wi-Fi 名称，操作期间保持电脑开机。</p><p>电脑使用网线时，需与手机处在同一个可互访的局域网。</p></div><div class="message" id="message" role="status"></div><div class="actions"><button class="back" id="back" onclick="move(-1)">返回</button><button id="next" onclick="next()"></button></div><details><summary>连接遇到问题？</summary><p>确认电脑和手机连接同一个可互访 Wi-Fi。访客网络可能限制设备互访。电脑保持开机，必要时允许防火墙的局域网连接。</p><p>停止助手前，先将手机 Wi-Fi 的「配置代理」设为「关闭」并存储。</p><p><a id="diagnosticDownload">保存日志</a></p><pre id="logs"></pre><button class="secondary" onclick="stopOnly()">停止代理</button></details></main><script>
const key=new URLSearchParams(location.search).get('key');document.querySelector('#diagnosticDownload').href='/api/diagnostics?key='+key;let step=0,state={},busy=false;let selected=null;let mode='install';
const steps=[
{title:'选择要进行的操作',intro:'电脑和 iPhone 需要连接同一个可互访的 Wi-Fi。',body:()=>'<div class="taskChoices"><label class="taskChoice"><input type="radio" name="task" onchange="mode=&#39;capture&#39;"><strong>导出当前手机中的模型</strong><span>保存到电脑，用于编辑或备份</span></label><label class="taskChoice"><input type="radio" name="task" checked onchange="mode=&#39;install&#39;"><strong>替换手机当前模型</strong><span>选择电脑中的模型 ZIP</span></label></div>',button:'已连接，继续'},
{title:'选择你的资源包',intro:'载入已转换好的 iOS 完整 ZIP。',body:()=>'<label class="drop"><strong id="fileLabel">选择 ZIP 文件</strong><small>点击选择 · 最大 256 MB</small><input type="file" id="file" accept=".zip" onchange="choose(this)"></label><p class="note" id="packageInfo">'+(state.package?.bytes?'已载入 · '+(state.package.bytes/1e6).toFixed(2)+' MB':'文件保存在本机。')+'</p>',button:'载入并开始'},
{title:'用 iPhone 相机扫码',intro:'使用手机的相机扫描二维码，打开网页链接。',body:()=>'<img class="qr" alt="手机设置二维码" src="/qr?key='+key+'"><p class="note" style="text-align:center">在手机页面点击「下载 mitmproxy 证书」，再点「允许」。</p>',button:'证书已下载'},
{title:'在手机上安装证书',intro:'现在可以切到手机设置，继续看电脑上的指引。',body:()=>'<div class="path">设置 → 通用<br>→ VPN 与设备管理</div><div class="row">点开刚下载的证书，点击「安装」。</div><div class="row">输入手机锁屏密码，按提示完成安装。</div><p class="note">证书名称为 mitmproxy。找不到时，返回上一步重新下载。</p>',button:'已安装，继续'},
{title:'开启证书信任',intro:'安装后，还需要开启完全信任。',body:()=>'<div class="path">设置 → 通用 → 关于本机<br>→ 证书信任设置</div><div class="row">滑到页面底部，打开刚安装证书旁的开关。</div><p class="note">阅读系统提示后确认。此步骤仅首次安装需要完成。</p>',button:'已开启信任'},
{title:'填写 Wi-Fi 代理',intro:'设置 → Wi-Fi → 当前网络右侧 ⓘ → 配置代理 → 手动',body:()=>'<div class="fields"><div class="field">服务器<strong>'+ip()+'</strong></div><div class="field">端口<strong>18999</strong></div></div><div class="row">「认证」保持关闭，点右上角「存储」。</div><p class="note">照着电脑填写即可，无需返回手机浏览器。</p>',button:'已存储，继续'},
{title:'打开车辆页面',intro:'完全退出车辆 App，再打开车辆页面获取资源。',body:()=>'<p id="installStatus">请在手机上打开车辆页面，出现「获取资源」时点击下载。</p><p class="note">下载后保持代理开启，退出并重新打开车辆应用，完成第二次更新。</p>',button:'效果已确认'},
{title:'最后，关闭手机代理',intro:'完成操作后，请关闭手机 Wi-Fi 代理。',body:()=>'<div class="path">设置 → Wi-Fi → 当前网络 ⓘ<br>→ 配置代理 → 关闭 → 存储</div><p class="note">先在手机关闭，再停止电脑代理。否则退出助手后，手机可能无法通过这个 Wi-Fi 正常联网。</p>',button:'手机已关闭，完成'},
{title:'应用完成',intro:'手机代理已关闭，电脑代理已停止。',body:()=>'<div class="success">✓</div><p class="note">下次使用同一电脑，通常可以复用证书设置。不再使用时，可在手机「VPN 与设备管理」中移除证书。</p>',button:'返回操作选择'}];
function ip(){try{return new URL(state.phone).hostname}catch{return '等待连接'}}
function render(){const s=steps[step];document.querySelector('#connectionHelp').classList.toggle('hidden',step!==0);document.querySelector('#progress').innerHTML=steps.slice(0,-1).map((_,i)=>'<i class="'+(i<=step?'done':'')+'"></i>').join('');document.querySelector('#eyebrow').textContent=step===8?'已完成':(step+1)+' / 8';document.querySelector('#title').textContent=s.title;document.querySelector('#intro').textContent=s.intro;document.querySelector('#content').innerHTML=s.body();if(step===8&&mode==='capture'){document.querySelector('#title').textContent='导出完成';}if(step===6&&mode==='capture'){document.querySelector('#title').textContent='导出手机模型';document.querySelector('#intro').textContent='请在手机上打开车辆页面，保持页面开启。';document.querySelector('#content').innerHTML='<p id="captureStatus">请在手机上打开车辆页面</p><a id="downloadOriginal" class="hidden" href="/api/original?key='+key+'">保存模型到电脑</a>';}document.querySelector('#next').textContent=(step===6&&mode==='capture')?'保存后继续':s.button;document.querySelector('#back').style.visibility=step===0||step===8?'hidden':'visible';document.querySelector('#message').textContent='';if(step===0){let choices=document.querySelectorAll('input[name=task]');if(choices.length)choices[mode==='capture'?0:1].checked=true}}
function move(n){let target=Math.max(0,Math.min(8,step+n));if(mode==='capture'&&target===1)target=n<0?0:2;step=target;render()}
function choose(input){selected=input.files[0];document.querySelector('#fileLabel').textContent=selected?.name||'选择 ZIP 文件'}
async function call(name,data){const r=await fetch('/api/'+name+'?key='+key,{method:'POST',body:data});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
async function next(){if(busy)return;busy=true;document.querySelector('#next').disabled=true;try{if(step===0&&mode==='capture'){await call('capture');await refresh();step=2;render();return}if(step===6&&mode!=='capture'&&state.diagnostics?.installStage!=='final-served')throw Error('请先完成手机上的两次资源更新');if(step===6&&mode==='capture'&&state.capture?.stage!=='downloaded')throw Error('请等待模型获取完成');if(step===1){if(selected){document.querySelector('#message').textContent='正在校验资源并自动切换，请稍候…';await call('upload',selected);selected=null}else if(!state.package?.bytes)throw Error('请先选择一个 ZIP 文件');await call('start');await refresh()}if(step===7){await call('stop');await refresh()}if(step===8){step=0;render()}else move(1)}catch(e){document.querySelector('#message').textContent=e.message}finally{busy=false;document.querySelector('#next').disabled=step===6&&(mode==='capture'?state.capture?.stage!=='downloaded':state.diagnostics?.installStage!=='final-served')}}
async function quitHelper(){if(!confirm('请先将手机 Wi-Fi 代理设为关闭。退出助手会停止代理并释放端口。继续退出？'))return;try{await call('quit');clearInterval(refreshTimer);document.body.innerHTML='<main><h1>助手已退出</h1><p>本地服务和代理已停止。现在可以关闭这个页面。</p></main>'}catch(e){document.querySelector('#message').textContent=e.message}}
async function stopOnly(){try{await call('stop');await refresh();document.querySelector('#message').textContent='电脑代理已停止，请确认手机 Wi-Fi 代理也已关闭。'}catch(e){document.querySelector('#message').textContent=e.message}}
async function refresh(){let r=await fetch('/api/status?key='+key);if(!r.ok)throw Error('连接已失效，请从本机重新打开助手');state=await r.json();document.querySelector('.brand').title=state.version||'';document.querySelector('#status').textContent=state.running?'代理运行中':'代理已停止';document.querySelector('#logs').textContent=state.log||'暂无记录';const cs=document.querySelector('#captureStatus');if(cs){let stage=state.capture?.stage;let messages={waiting:'请在手机上打开车辆页面',downloading:'正在获取模型，请保持手机页面开启…',waiting_download:'请在手机车辆页面点击获取资源',downloaded:'模型已获取，请保存到电脑'};let message=messages[stage]||state.capture?.message||'请在手机上打开车辆页面';if(stage==='waiting'&&state.diagnostics?.tlsFailure)message=state.diagnostics.tlsFailure.message;cs.textContent=message;};const installStatus=document.querySelector('#installStatus');if(installStatus){const stage=state.diagnostics?.installStage;installStatus.textContent=stage==='error'?state.diagnostics.installError:stage==='final-served'?'资源已发送，请确认手机模型显示正常。':stage==='trigger-served'?'首次资源已发送，请保持代理开启，退出并重新打开车辆应用。':'请在手机上打开车辆页面，出现「获取资源」时点击下载。';document.querySelector('#next').disabled=busy||stage!=='final-served';}const link=document.querySelector('#downloadOriginal');if(link)link.classList.toggle('hidden',state.capture?.stage!=='downloaded');if(step===6&&mode==='capture')document.querySelector('#next').disabled=busy||state.capture?.stage!=='downloaded';document.querySelector('#logs').textContent=JSON.stringify(state.diagnostics||{},null,2)+'\n'+(state.log||'')}
refresh().then(render).catch(e=>document.querySelector('#message').textContent=e.message);const refreshTimer=setInterval(()=>refresh().catch(()=>document.querySelector('#status').textContent='助手未连接'),3000);
</script></html>
