<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接资源工具</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#182b23;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:500px;margin:auto;padding:30px 24px}header{font-size:14px;color:#728277;margin-bottom:42px}.progress{font-size:12px;color:#8b978e;margin-bottom:14px}h1{font-size:30px;line-height:1.3;font-weight:600;letter-spacing:-.8px;margin:0 0 14px}p{color:#6e7e73;line-height:1.8;font-size:15px}.card{padding:24px;background:white;border:1px solid #e1e6df;border-radius:18px;margin:24px 0}.path{font-size:19px;line-height:1.9}b{font-weight:600}a,button{display:block;background:#255943;color:white;text-align:center;padding:16px;border-radius:11px;text-decoration:none;font:inherit;border:0;width:100%;margin:12px 0;cursor:pointer}.secondary{background:transparent;color:#76857a}small{display:block;color:#8b978e;font-size:12px;line-height:1.8}.field{padding:12px 0;border-bottom:1px solid #edf0e9;color:#7f8e83;font-size:13px}.field strong{display:block;color:#243c2e;font-size:22px;margin-top:7px}.field:last-child{border:0}footer{font-size:12px;color:#8b978e;margin-top:28px;line-height:1.8}</style><main><header>资源工具 / 连接 iPhone</header><div class="progress" id="progress"></div><h1 id="title"></h1><p id="intro"></p><div id="body"></div><button id="next" onclick="move(1)"></button><button class="secondary" id="back" onclick="move(-1)">返回上一步</button><footer>切到手机设置后，可以直接看电脑助手中的同一步骤。无需反复切回手机浏览器。</footer></main><details style="margin:20px 24px;color:#718077"><summary>连接遇到问题？</summary><button class="secondary" onclick="testProxy()">检查连接</button><p id="probeResult"></p></details><script>
async function testProxy(){let el=document.querySelector('#probeResult');el.textContent='正在检测…';try{let controller=new AbortController();let timer=setTimeout(()=>controller.abort(),8000);let r=await fetch('http://local-helper.invalid/check?key=__PHONE_TOKEN__',{signal:controller.signal,cache:'no-store'});clearTimeout(timer);let d=await r.json();if(!r.ok||!d.connected)throw Error();el.textContent='连接正常，请打开手机车辆页面。'}catch(e){el.textContent='未连接到代理。请核对当前 Wi-Fi 的服务器地址、18999 端口和电脑防火墙。'}}

const steps=[
['下载本机证书','确认手机和电脑连接同一个 Wi-Fi。','<div class="card"><b>证书名称 · mitmproxy</b><p>用于本次本地资源传输。点击下载后，在系统提示中选择「允许」。</p><a href="/certificate?key=__PHONE_TOKEN__">下载 mitmproxy 证书</a><small>每台电脑生成自己的证书，证书名称相同。只安装当前电脑提供的证书。</small></div>','已下载，查看安装步骤'],
['安装 mitmproxy 证书','打开手机「设置」，按下面路径操作。','<div class="card"><div class="path">通用 → VPN 与设备管理<br>→ mitmproxy → 安装</div><p>输入手机锁屏密码，按提示完成安装。</p><small>找不到时，在设置首页查找「已下载描述文件」，或返回上一步重新下载。</small></div>','已安装，继续'],
['开启完全信任','证书安装后，还需要开启信任开关。','<div class="card"><div class="path">设置 → 通用 → 关于本机<br>→ 证书信任设置</div><p>滑到最下面，打开 <b>mitmproxy</b> 旁边的开关，阅读系统提示后确认。</p></div>','已开启信任'],
['连接电脑代理','设置 → Wi-Fi → 当前网络右侧 ⓘ → 配置代理 → 手动','<div class="card"><div class="field">服务器<strong>__IP__</strong></div><div class="field">端口<strong>__PORT__</strong></div><div class="field">认证<strong>关闭</strong></div><p>填写后，点击右上角「存储」。</p></div>','已存储，继续'],
['打开爱车模型页面','从手机多任务界面划掉车辆 App，再重新打开。','<div class="card"><p>进入爱车模型页面，保持 App 前台至少 <b>15 秒</b>。</p><p>按照电脑助手提示确认新外观、完成收尾，再验证重开后仍保留。</p><small>仍是原厂外观时，再划掉 App 后重开并继续等待。</small></div>','已打开模型页面'],
['最后，关闭 Wi-Fi 代理','完成修改或恢复后，请先完成这一步。','<div class="card"><div class="path">设置 → Wi-Fi → 当前网络 ⓘ<br>→ 配置代理 → 关闭 → 存储</div><p>然后再停止电脑助手。否则手机可能无法通过这个 Wi-Fi 正常联网。</p></div>','手机代理已关闭'],
['设置完成','电脑助手可以停止代理了。','<div class="card"><p>同一电脑的证书通常可以复用。下次使用时再开启 Wi-Fi 代理。</p><small>不再使用时，可以在「VPN 与设备管理」移除 mitmproxy 证书。</small></div>','回看设置']];let step=0;function render(){let s=steps[step];document.querySelector('#progress').textContent=(step+1)+' / '+steps.length;document.querySelector('#title').textContent=s[0];document.querySelector('#intro').textContent=s[1];document.querySelector('#body').innerHTML=s[2];document.querySelector('#next').textContent=s[3];document.querySelector('#back').style.visibility=step?'visible':'hidden'}function move(n){step=step===steps.length-1&&n>0?0:Math.max(0,Math.min(steps.length-1,step+n));render()}render();
</script></html>
