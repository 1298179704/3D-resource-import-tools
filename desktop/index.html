<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; frame-src http://127.0.0.1:*; img-src 'self' data:"><title>资源工具</title><link rel="stylesheet" href="style.css"></head><body><header><strong>资源工具</strong><button id="home" hidden>返回首页</button><small id="connection">正在启动</small></header><main id="main"><section id="platform"><p class="eyebrow">资源在你的设备之间传输</p><h1>连接你的手机</h1><p class="intro">从手机提取资源，或替换手机中的资源。</p><div class="choices"><button id="iphone"><b>iPhone</b><span>同一 Wi-Fi · 证书与代理</span></button><button id="android"><b>安卓手机</b><span>USB 数据线 · USB 调试</span></button></div><p class="note">首次使用时，助手会逐步引导你完成连接。</p></section><section id="androidPanel" hidden><p class="eyebrow" id="stepLabel">1 / 3</p><h1 id="androidTitle">用数据线连接手机</h1><p class="intro" id="androidIntro">开启 USB 调试，在手机上点“允许此电脑调试”。</p><div class="card" id="androidContent"></div><div class="actions"><button id="back" class="secondary">上一步</button><button id="next">检查连接</button></div><details><summary>连接遇到问题？</summary><p>打开设置，搜索“开发者选项”，开启 USB 调试。手机保持解锁，并使用支持数据传输的数据线。Windows 若无法识别设备，请安装该手机厂商提供的 USB 驱动。</p></details></section><p id="message" role="status"></p></main><iframe id="iphoneFrame" title="iPhone 连接引导" hidden></iframe><footer><span>资源工具 0.2.1</span><button id="diagnostics">保存日志</button></footer><script src="renderer.js"></script></body></html>
